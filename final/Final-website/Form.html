<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="website.css">
    <title>Apply Now</title>
</head>
<body>
    <header>
        <h1>Apply Now</h1>
        <nav>
            <a class="nav-link" href="Mainpage.html">Home</a>
            <a class="nav-link" href="About-Me.html">Daily Routine</a>
            <a class="nav-link" href="Service.html">Services</a>
            <a class="nav-link" href="Job-Data.html">Customer Service Data</a>
            <a class="nav-link" href="Form.html">Apply Now</a>
        </nav>
    </header> 
    <main>
        <h2>Go on workday to apply by clicking this link <a href="https://hr.byuh.edu/student-employment">BYUH Job Board</a> or sign up below</h2>
        <div class="container-form"> 
            <div id="message"></div>
            <form action="processing-form" method="post" id="myform">
                <fieldset>
                    <legend>Apply</legend>
                    <div class="form-row">
                        <label for="firstname">First Name:</label>
                        <input type="text" name="First-Name" id="firstname" placeholder="First Name ">
                    </div>

                    <div class="form-row">
                        <label for="lastname">Last Name:</label>
                        <input type="text" name="legal-age" id="age" placeholder="Last Name">
                    </div>

                    <div class="form-row">
                        <label for="age">Age:</label>
                        <input type="number" name="Last-Name" id="lastname" placeholder="age">
                    </div>

                    <div class="form-row">
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="Example@byuh.edu">
                    </div>

                    <div class="form-row">
                        <label for="phoneinput">Phone:</label>
                        <input type="tel" name="phonenumber" id="phoneinput" placeholder="(808)-000-0000">
                    </div>

                    <div class="form-row">
                        <label for="dateinput">Date:</label>
                        <input type="date" name="birthdate" id="dateinput">
                    </div>

                    <div class="check-row">
                        <div class="spacer">Gender:</div>
                        <label><input type="radio" name="gender" value="male">Male</label>
                        <label><input type="radio" name="gender" value="female">Female</label>
                    </div>

                    <div class="form-row">
                        <label for="Year">Student Year</label>
                        <select name="statesection" id="Year">
                            <option value="none">------------</option>
                            <option value="FM">Freshmen</option>
                            <option value="SH">Sophomore</option>
                            <option value="Jr">Junior</option>
                            <option value="Sn">Senior</option>  
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="Experience">Experience</label>
                        <textarea name="comment" id="Experience"></textarea>
                    </div>

                    <div class="check-row">
                        <div class="spacer"></div>
                        <label><input type="checkbox" name="agree" value="on">I agree to the terms.</label>  
                    </div>

                    <div class="form-row">
                        <div class="spacer"></div>
                        <input type="submit" value="Apply">
                    </div>
                </fieldset>
            </form>               
        </div>    
    </main>
    <script src="websiteform.js"></script>
</body>
</html>
